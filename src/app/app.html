<div
  class="min-h-screen flex flex-col bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-['Cairo',sans-serif] selection:bg-sky-100 dark:selection:bg-sky-900 selection:text-sky-900 dark:selection:text-sky-100 transition-colors duration-200"
>
  <app-navbar />

  <main class="flex-1">
    <router-outlet />
  </main>

  <app-footer />

  <div class="fixed bottom-6 right-6 z-40">
    <button
      (click)="state.toggleDarkMode()"
      class="w-12 h-12 rounded-full flex items-center justify-center bg-white dark:bg-slate-800 shadow-lg hover:shadow-xl border border-slate-200 dark:border-slate-700 transition-all duration-300 hover:scale-110 active:scale-95"
      aria-label="تبديل المظهر"
    >
      @if (state.isDarkMode()) {
        <svg lucideSun class="w-5 h-5 text-amber-400"></svg>
      } @else {
        <svg lucideMoon class="w-5 h-5 text-slate-700"></svg>
      }
    </button>
  </div>

  <div class="fixed bottom-6 left-6 z-40">
    <a
      href="https://api.whatsapp.com/send?phone=201028535623"
      target="_blank"
      rel="noopener noreferrer"
      class="relative flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 sm:px-5 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-105 active:scale-95"
      title="تواصل معنا عبر الواتساب"
    >
      <span
        class="w-2.5 h-2.5 rounded-full bg-white animate-ping absolute -top-0.5 -right-0.5"
      ></span>
      <svg lucideMessageSquare class="w-5 h-5"></svg>
      <span class="text-xs sm:text-sm font-bold">تواصل معنا</span>
    </a>
  </div>
  @if (state.selectedPhoneForDetail(); as phone) {
    <app-product-detail-modal [phone]="phone" />
  }

  @if (state.isCompareOpen() && state.comparedPhones().length > 0) {
    <app-compare-modal />
  }

  @if (state.selectedPhoneForOrder(); as phone) {
    <app-order-modal [phone]="phone" />
  }
</div>
