<div
  class="group relative h-full bg-white dark:bg-slate-900 rounded-[22px] border border-slate-200/85 dark:border-slate-800 p-4 flex flex-col justify-between hover:shadow-xl hover:border-slate-300 dark:hover:border-slate-700 transition-all duration-300"
>
  <div>
    <div class="flex items-center justify-between gap-2 mb-3">
      <div
        class="flex items-center gap-1.5 text-[11px] font-bold text-slate-700 dark:text-slate-300 bg-slate-50 dark:bg-slate-800/80 px-2 py-0.5 rounded-md border border-slate-200/60 dark:border-slate-700/60"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>{{ phone().badgeStatus }}</span>
      </div>

      <div [class]="'text-[11px] font-bold px-2.5 py-0.5 rounded-md border ' + tagStyle()">
        {{ phone().tag }}
      </div>
    </div>

    <div
      (click)="state.selectedPhoneForDetail.set(phone())"
      class="relative w-full h-40 bg-linear-to-b from-slate-50/70 to-slate-100/50 dark:from-slate-800/60 dark:to-slate-800/90 rounded-xl overflow-hidden mb-3.5 cursor-pointer border border-slate-100 dark:border-slate-800 flex items-center justify-center p-2 group-hover:bg-slate-50 dark:group-hover:bg-slate-800 transition-colors"
    >
      <img
        [src]="phone().image"
        [alt]="phone().name"
        class="w-full h-full object-contain mix-blend-multiply dark:mix-blend-normal group-hover:scale-105 transition-transform duration-300"
        loading="lazy"
      />

      <button
        (click)="$event.stopPropagation(); state.selectedPhoneForDetail.set(phone())"
        class="absolute top-2 left-2 p-1.5 rounded-lg bg-white/90 dark:bg-slate-800/90 hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 shadow-xs opacity-0 group-hover:opacity-100 transition-opacity"
        title="معاينة المواصفات"
      >
        <svg lucideEye class="w-4 h-4"></svg>
      </button>

      <button
        (click)="$event.stopPropagation(); state.toggleCompare(phone())"
        [class]="
          'absolute top-2 right-2 p-1.5 rounded-lg shadow-xs transition-all ' +
          (isCompared()
            ? 'bg-sky-600 text-white opacity-100'
            : 'bg-white/90 dark:bg-slate-800/90 hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 opacity-0 group-hover:opacity-100')
        "
        [title]="isCompared() ? 'إزالة من المقارنة' : 'إضافة للمقارنة'"
      >
        @if (isCompared()) {
          <svg lucideCheck class="w-4 h-4"></svg>
        } @else {
          <svg lucideScale class="w-4 h-4"></svg>
        }
      </button>
    </div>

    <h3
      (click)="state.selectedPhoneForDetail.set(phone())"
      class="text-center font-extrabold text-slate-900 dark:text-white text-base sm:text-[17px] hover:text-sky-600 dark:hover:text-sky-400 transition-colors cursor-pointer mb-1 tracking-tight"
    >
      {{ phone().name }}
    </h3>

    <p
      class="text-center text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 line-clamp-1 mb-3 px-1"
    >
      {{ phone().summarySpec }}
    </p>

    <div class="flex flex-wrap items-center justify-center gap-1.5 mb-4">
      @for (spec of phone().specTags; track spec) {
        <span
          class="text-[10px] font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2 py-0.5 rounded-md border border-slate-200/50 dark:border-slate-700/60"
        >
          {{ spec }}
        </span>
      }
    </div>
  </div>

  <div>
    <div class="pt-2 border-t border-slate-100 dark:border-slate-800 mb-3 text-center">
      <div
        class="flex items-center justify-between text-xs text-slate-400 dark:text-slate-400 font-medium px-1"
      >
        <span class="line-through decoration-slate-400 font-sans"
          >${{ phone().originalPrice }}</span
        >
        <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium"
          >سعر الموزع الرسمي</span
        >
      </div>

      <div
        class="text-2xl font-black text-slate-900 dark:text-white tracking-tight mt-0.5 font-sans"
      >
        ${{ phone().price | number }}
      </div>
    </div>

    <button
      (click)="state.selectedPhoneForOrder.set(phone())"
      class="w-full bg-[#0b131e] hover:bg-slate-800 dark:bg-sky-600 dark:hover:bg-sky-500 text-white font-bold py-2.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-xs hover:shadow-md transition-all active:scale-98"
    >
      <svg lucideShoppingBag class="w-4 h-4"></svg>
      <span>اطلب الآن</span>
    </button>
  </div>
</div>
