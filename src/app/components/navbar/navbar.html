<header
  class="w-full bg-white dark:bg-slate-900 sticky top-0 z-40 border-b border-slate-100 dark:border-slate-800 shadow-xs transition-colors duration-200"
>
  <div
    class="max-w-7xl mx-auto px-4 sm:px-8 py-3.5 sm:py-4 flex items-center justify-between gap-4"
  >
    <a routerLink="/" class="flex items-center gap-3 cursor-pointer select-none group">
      <div
        class="w-10 h-10 rounded-full bg-black dark:bg-white text-white dark:text-slate-900 flex items-center justify-center font-black text-lg tracking-wider shadow-sm transition-transform group-hover:scale-105"
      >
        H
      </div>
      <div class="flex flex-col">
        <div class="flex items-center gap-2">
          <span
            class="font-extrabold text-xl sm:text-2xl tracking-tight text-slate-900 dark:text-white font-sans"
            >HONOR</span
          >
          <span
            class="hidden sm:inline-flex bg-sky-50 dark:bg-sky-950/70 text-sky-700 dark:text-sky-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-sky-200 dark:border-sky-800"
          >
            موزع رسمي
          </span>
        </div>
        <span class="text-[10px] text-slate-500 dark:text-slate-400 font-medium tracking-tight">
          Authorized Regional Partner
        </span>
      </div>
    </a>

    <nav
      class="hidden lg:flex items-center gap-1 bg-slate-100/80 dark:bg-slate-800/80 p-1.5 rounded-full border border-slate-200/60 dark:border-slate-700/60 shadow-xs"
    >
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-sm font-bold rounded-full transition-all"
          [class]="
            'px-6 py-2 text-sm font-bold rounded-full transition-all ' +
            (rla.isActive ? desktopActive : desktopIdle)
          "
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-2 sm:gap-3">
      @if (state.compareCount() > 0) {
        <button
          (click)="state.isCompareOpen.set(true)"
          class="flex items-center gap-1.5 px-3 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 text-xs sm:text-sm font-bold rounded-xl transition-all"
          title="مقارنة الأجهزة المختارة"
        >
          <svg lucideScale class="w-4 h-4 text-sky-600 dark:text-sky-400"></svg>
          <span class="hidden sm:inline">مقارنة</span>
          <span
            class="bg-sky-600 text-white w-5 h-5 rounded-full text-[11px] flex items-center justify-center font-bold"
          >
            {{ state.compareCount() }}
          </span>
        </button>
      }
    </div>
  </div>

  <div
    class="flex lg:hidden overflow-x-auto no-scrollbar border-t border-slate-100 dark:border-slate-800 px-4 py-2 gap-2 bg-slate-50 dark:bg-slate-950 text-xs"
  >
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive
        #rlaM="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [class]="
          'px-4 py-1.5 rounded-lg whitespace-nowrap font-bold ' +
          (rlaM.isActive ? mobileActive : mobileIdle)
        "
      >
        {{ link.label }}
      </a>
    }
  </div>
</header>
